        verification: "automated"
    artifacts: ["packages/cli/src/recommendations.ts", "packages/cli/src/interview.ts"]
    tests: ["packages/cli/src/index.test.ts :: interview recommends missing stack and persists proposal", "packages/cli/src/index.test.ts :: interview evaluates user choices instead of silently confirming"]
