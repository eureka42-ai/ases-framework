name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint source and scripts
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build package artifacts
        run: pnpm build
      - name: Unit and end-to-end tests
        run: pnpm test:unit
      - name: Validate host integrations
        run: pnpm integrations:validate
      - name: Smoke test CLI
        run: pnpm smoke

  supply-chain:
    name: Audit, licenses, SBOM, and provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.20.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Validate declared licenses and generate SPDX SBOM
        run: pnpm supply-chain
        env:
          ASES_SBOM_OUTPUT: ${{ runner.temp }}/eureka42-ases-framework.spdx.json
      - name: Pack CLI release artifact
        run: npm pack ./packages/cli --pack-destination "${{ runner.temp }}"
      - name: Attest package build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/eureka42-ases-cli-0.1.0-rc.1.tgz
      - name: Attest SBOM for package
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/eureka42-ases-cli-0.1.0-rc.1.tgz
          sbom-path: ${{ runner.temp }}/eureka42-ases-framework.spdx.json
      - name: Upload SBOM and package
        uses: actions/upload-artifact@v7
        with:
          name: ases-cli-sbom-and-package
          path: |
            ${{ runner.temp }}/eureka42-ases-framework.spdx.json
            ${{ runner.temp }}/eureka42-ases-cli-0.1.0-rc.1.tgz
          if-no-files-found: error
